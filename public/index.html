<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Email Extractor</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; max-width: 900px; }
    textarea { width: 100%; height: 150px; }
    pre { background: #f4f4f4; padding: 10px; white-space: pre-wrap; border-radius: 4px; }
    .section { margin-top: 20px; }
    button { padding: 8px 16px; font-size: 14px; cursor: pointer; }
    #status { font-weight: bold; }
  </style>
</head>
<body>
  <h1>Email Address Extractor from Multiple Websites</h1>
  <p>Enter website URLs, one per line:</p>

  <textarea id="urlsInput" placeholder="https://example.com&#10;https://another-site.com"></textarea>
  <br><br>
  <button id="extractBtn">Extract Emails</button>

  <div class="section" id="status"></div>

  <div class="section">
    <h2>All unique emails found</h2>
    <pre id="allEmails"></pre>
  </div>

  <div class="section">
    <h2>Filtered valid (refined) emails</h2>
    <pre id="validEmails"></pre>
  </div>

  <script>
    const extractBtn = document.getElementById('extractBtn');
    const urlsInput = document.getElementById('urlsInput');
    const statusDiv = document.getElementById('status');
    const allEmailsPre = document.getElementById('allEmails');
    const validEmailsPre = document.getElementById('validEmails');

    extractBtn.addEventListener('click', async () => {
      const raw = urlsInput.value.trim();
      if (!raw) {
        alert('Please enter at least one URL.');
        return;
      }

      const urls = raw
        .split('\n')
        .map(u => u.trim())
        .filter(Boolean);

      statusDiv.textContent = `Processing ${urls.length} URLs...`;
      allEmailsPre.textContent = '';
      validEmailsPre.textContent = '';

      try {
        const res = await fetch('/api/extract-emails', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ urls })
        });

        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.error || 'Request failed');
        }

        const data = await res.json();
        statusDiv.textContent = 'Done.';

        if (data.allEmails && data.allEmails.length) {
          allEmailsPre.textContent = data.allEmails.join('\n');
        } else {
          allEmailsPre.textContent = 'No emails found.';
        }

        if (data.validEmails && data.validEmails.length) {
          validEmailsPre.textContent = data.validEmails.join('\n');
        } else {
          validEmailsPre.textContent = 'No valid emails found.';
        }
      } catch (e) {
        console.error(e);
        statusDiv.textContent = 'Error: ' + e.message;
      }
    });
  </script>
</body>
</html>
